<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Editor Portfolio</title>
  <meta name="description" content="Video editor portfolio: music videos, commercials, reels, weddings and short films.">
  <meta name="theme-color" content="#07070a">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="grain" aria-hidden="true"></div>

  <!-- Top navigation -->
  <header class="nav" id="nav">
    <div class="nav-inner">
      <a class="logo" id="nav-logo" href="#hero" aria-label="Back to top"><span class="logo-dot" aria-hidden="true"></span><span id="nav-logo-text">Portfolio</span></a>
      <nav class="nav-links" id="nav-links" aria-label="Main"></nav>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>
  <div class="mobile-menu" id="mobile-menu" aria-label="Menu">
    <nav class="mobile-links" id="mobile-links" aria-label="Mobile"></nav>
  </div>

  <main id="main">
    <!-- Hero -->
    <section class="hero" id="hero" aria-labelledby="hero-tagline">
      <div class="hero-bg" aria-hidden="true">
        <div class="aurora"><i></i><i></i><i></i></div>
        <div class="hero-media" id="hero-media"></div>
        <div class="hero-shade"></div>
      </div>
      <div class="viewfinder" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

      <div class="hero-top" aria-hidden="true">
        <span class="rec"><i></i>REC</span>
        <span class="timecode" id="timecode">00:00:00:00</span>
      </div>

      <div class="hero-body">
        <p class="hero-role" id="hero-role"></p>
        <h1 class="hero-tagline" id="hero-tagline"></h1>
        <p class="hero-intro" id="hero-intro"></p>
        <div class="hero-actions">
          <button class="btn btn-primary" id="play-showreel" type="button" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z" fill="currentColor"/></svg>
            Play showreel
          </button>
          <a class="btn btn-ghost" href="#contact">Get in touch</a>
        </div>
        <p class="hero-meta" id="hero-meta"></p>
      </div>
      <a class="scroll-cue" href="#work-start" aria-label="Scroll to work"><span></span></a>
    </section>

    <!-- Genre ticker -->
    <div class="ticker" id="ticker" aria-hidden="true">
      <div class="ticker-track" id="ticker-track"></div>
    </div>

    <!-- Error state -->
    <section class="load-error" id="load-error" role="alert" hidden>
      <h2>Signal lost</h2>
      <p id="load-error-text">The portfolio content could not be loaded.</p>
      <button class="btn btn-primary" id="retry-load" type="button">Try again</button>
    </section>

    <!-- One section per genre (generated) -->
    <div id="work-start" class="work-anchor"></div>
    <div id="sections"></div>

    <!-- About -->
    <section class="about" id="about" aria-labelledby="about-title">
      <div class="about-inner">
        <div class="about-head reveal">
          <span class="eyebrow">The editor</span>
          <h2 id="about-title">About</h2>
          <p class="about-name" id="about-name"></p>
        </div>
        <div class="about-body reveal">
          <div class="about-text" id="about-text"></div>
          <dl class="stats" id="about-stats"></dl>
        </div>
      </div>
    </section>

    <!-- Contact -->
    <section class="contact" id="contact" aria-labelledby="contact-title">
      <div class="contact-inner reveal">
        <span class="eyebrow">Next project</span>
        <h2 id="contact-title">Let's make something worth watching.</h2>
        <a class="contact-email" id="contact-email" href="#contact"></a>
        <ul class="socials" id="contact-socials" aria-label="Social links"></ul>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-text">&copy; <span id="year"></span> <span id="footer-name"></span>. All rights reserved.</p>
      <button id="admin-trigger" class="admin-trigger" type="button" aria-label="Admin">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </button>
    </div>
  </footer>

  <!-- Lightbox player -->
  <div class="player" id="player" role="dialog" aria-modal="true" aria-labelledby="player-title" hidden>
    <div class="player-backdrop" id="player-backdrop"></div>
    <div class="player-box">
      <div class="player-bar">
        <h2 class="player-title" id="player-title"></h2>
        <button class="player-close" id="player-close" type="button" aria-label="Close player">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
      <div class="player-stage" id="player-stage"></div>
      <p class="player-meta" id="player-meta"></p>
    </div>
  </div>

  <noscript><p class="noscript">This portfolio needs JavaScript to load its content.</p></noscript>

  <script src="assets/js/site.js" defer></script>
  <script src="assets/js/admin.js" defer></script>
</body>
</html>
